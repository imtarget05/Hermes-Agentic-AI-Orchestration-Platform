# Hermes — Project 1 async stack
#   docker compose up -d            -> infra (rabbitmq, kafka, postgres, prometheus, grafana)
#   docker compose up worker api    -> app services
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: hermes-rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.8
    container_name: hermes-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
      POSTGRES_DB: hermes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: hermes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: hermes-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  worker:
    build: .
    container_name: hermes-worker
    command: python -m hermes.async_engine.cli work
    environment:
      HERMES_ASYNC_MODE: rabbitmq
      HERMES_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      HERMES_DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermes
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - rabbitmq
      - postgres
      - kafka

  orchestrator:
    build: .
    container_name: hermes-orchestrator
    command: python -m hermes.async_engine.cli orchestrator
    environment:
      HERMES_ASYNC_MODE: rabbitmq
      HERMES_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      HERMES_DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermes
      HERMES_ADVANCE_INTERVAL: "0.5"
    depends_on:
      - rabbitmq
      - postgres

  api:
    build: .
    container_name: hermes-api
    command: uvicorn hermes.async_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      HERMES_ASYNC_MODE: rabbitmq
      HERMES_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      HERMES_DATABASE_URL: postgresql://hermes:hermes@postgres:5432/hermes
    depends_on:
      - rabbitmq
      - postgres

volumes:
  pgdata: