[project]
name = "hermes-agentic-platform"
version = "0.1.0"
description = "Hermes Agentic AI / Multi-Agent Platform - Project 02"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "click>=8.1",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
# Optional orchestrator backend — pure-python fallback is used when absent.
langgraph = ["langgraph>=0.2.0"]
# Optional Telegram delivery.
telegram = ["python-telegram-bot>=21.0"]
# Hermes Project 1 — async task queue engine extras.
mq = ["pika>=1.3.2"]
kafka = ["confluent-kafka>=2.4"]
metrics = ["prometheus-client>=0.20"]
async-all = [
  "pika>=1.3.2",
  "confluent-kafka>=2.4",
  "prometheus-client>=0.20",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# High-signal gate for CI: syntax/undefined names, unused bindings, import sorting.
# Stylistic rules (BLE001 blind-except, S110 try-except-pass, RUF059 test unpacking…)
# are intentionally not selected — the engine uses guarded excepts for resilience.
select = ["E4", "E7", "E9", "F", "I"]
